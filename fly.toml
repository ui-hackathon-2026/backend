# fly.toml app configuration file generated for coramu-be on 2026-09-18T02:26:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coramu-be'
primary_region = 'sin'

[build]

[env]
  APP_NAME = 'Hackathon API'
  DEBUG = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
